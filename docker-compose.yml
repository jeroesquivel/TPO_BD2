services:
  mongo:
    image: mongo:7
    container_name: vetsalud_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: vetsalud_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports: ["8000:8000"]
    depends_on: [mongo, redis]
    environment:
      MONGO_URI: mongodb://mongo:27017
      REDIS_HOST: redis

volumes:
  mongo_data:
  redis_data:
